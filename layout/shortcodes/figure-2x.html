<div class="pair">
  <figure>
    {{ if .Get "href1" }}<a href="{{ .Get "href1" }}">{{ end }}
    <img{{ with .Get "extra-class" }} class="{{ . }}"{{ end }} src="{{ .Get "src1" }}" alt="{{ .Get "title1" }}">
    {{ if .Get "href1" }}</a>{{ end }}
    <figcaption>{{ .Get "title1" }}</figcaption>
  </figure>
  <figure>
    {{ if .Get "href2" }}<a href="{{ .Get "href2" }}">{{ end }}
    <img{{ with .Get "extra-class" }} class="{{ . }}"{{ end }} src="{{ .Get "src2" }}" alt="{{ .Get "title2" }}">
    {{ if .Get "href2" }}</a>{{ end }}
    <figcaption>{{ .Get "title2" }}</figcaption>
  </figure>
</div>
