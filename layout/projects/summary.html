<div class="card{{ if .Params.featured }} featured{{ end }}">
        <h3><a href="{{ .Params.exterior_link | default .RelPermalink }}">{{ .Params.short_title }}</a></h3>
        <p class="years"><time>{{ .Params.start_date }}</time>{{ if ne .Params.end_date .Params.start_date }} – {{ if .Params.end_date }}<time>{{ .Params.end_date }}</time>{{ end }}{{ end }}</p>
        <a href="{{ .Params.exterior_link | default .RelPermalink }}"><img{{ if .Params.thumbnail_background }} class="add-background"{{ end }} src="{{ .Params.thumbnail }}" alt="{{ .Title }}"></a>
        <p>{{ .Description }}</p>
      </div>
